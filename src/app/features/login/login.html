<div class="login-container">

  <div class="login-card">

    <h1>Microservice UI</h1>

    <p class="subtitle">
      Welcome back! Please login to continue.
    </p>

    <form (ngSubmit)="login()">

      <!-- Username -->
      <div class="form-group">
        <label for="username">Username</label>

        <input
          id="username"
          type="text"
          name="username"
          [(ngModel)]="username"
          placeholder="Enter username"
          required
        />
      </div>

      <!-- Password -->
      <div class="form-group">
        <label for="password">Password</label>

        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Enter password"
          required
        />
      </div>

      <!-- Error Message -->
      @if (errorMessage) {
        <div class="error-message">
          {{ errorMessage }}
        </div>
      }

      <!-- Login Button -->
      <button type="submit" class="login-button">
        Login
      </button>

    </form>

  </div>

</div>
